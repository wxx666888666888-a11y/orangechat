name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare
        run: |
          chmod +x gradlew
          pnpm install --no-frozen-lockfile || true
          cd web-ui && npm install --legacy-peer-deps && cd ..
          rm -f app/debug.keystore
          keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "package me.rerere.material3" > material3/src/main/java/me/rerere/material3/DynamicSchemeExt.kt
          cat << 'EOF' > app/src/main/java/me/rerere/rikkahub/ui/theme/CustomTheme.kt
          package me.rerere.rikkahub.ui.theme

          import androidx.compose.material3.ColorScheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import kotlinx.serialization.Serializable
          import kotlin.uuid.Uuid

          @Serializable
          data class CustomTheme(
              val id: String = Uuid.random().toString(),
              val name: String = "",
              val primaryColorArgb: Long = 0xFF6750A4,
              val secondaryColorArgb: Long? = null,
              val tertiaryColorArgb: Long? = null,
          ) {
              fun generateColorScheme(dark: Boolean): ColorScheme {
                  return if (dark) darkColorScheme() else lightColorScheme()
              }
          }
          EOF
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "mock-project",
              "storage_bucket": "mock-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.lhzkml.jasmine"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "mock-api-key-123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Gradle Build
        run: ./gradlew assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: app/build/outputs/apk/debug/*.apk
